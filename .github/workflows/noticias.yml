name: Noticias IA (auto)

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede retrasarlo unos minutos en horas pico)
  workflow_dispatch: {}       # botón para ejecutar a mano cuando quieras

permissions:
  contents: write             # para guardar posted.json (anti-repetidos)

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar noticias
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAX_PER_RUN: "4"
        run: python bot.py

      - name: Guardar estado (anti-repetidos)
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git commit -m "estado: noticias publicadas" || echo "sin cambios"
          git push
