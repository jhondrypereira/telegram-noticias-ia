name: Noticias Venezuela (auto)

on:
  schedule:
    - cron: "10,40 * * * *"    # cada 30 min (desfasado del canal IA para no coincidir)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: venezuela
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar noticias de Venezuela
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID_VE }}
          MAX_PER_RUN: "5"
        run: python bot_ve.py
      - name: Guardar estado
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_ve.json
          git commit -m "estado: noticias Venezuela" || echo "sin cambios"
          git push
